<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia Gallery Page</title>
  </head>
  <body>
    <header>
      <h1>🎬 MY MEDIA GALLERY</h1>
      <p>Explore My Photos & Videos</p>
    </header>
    <hr />
    <nav>
      <a href="#">HOME</a>
      <a href="#photos">PHOTOS</a>
      <a href="#music">MUSIC</a>
      <a href="#videos">VIDEOS</a>
      <a href="#YtVideo">YOUTUBE VIDEO</a>
      <a href="#location">LOCATION</a>
    </nav>
    <main>
        <section id="photos">
      <h2>📸 PHOTO GALLERY</h2>
      <img
        src="college.avif"
        srcset="college.avif 480w, city.avif 800w, nature.jpg 1200w"
        height="200px"
        width="200px"
        alt="My College Image"
      />
    </section>
    <hr />
    <section id="music">
      <h2>🎵 AUDIO</h2>
      <p>My Favorite Song</p>
      <audio controls>
        <source src="song.mp3" type="audio/mpeg" />
      </audio>
    </section>
    <hr />
    <section id="videos">
      <h2>🎥 VIDEO</h2>
      <p>Song Video</p>
      <video controls>
        <source src="video.mp4" />
      </video>
    </section>
    <hr />
    <section id="YtVideo">
      <h2>▶️ YOUTUBE VIDEO</h2>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/B3It0j3LcRg?si=RnRfFJJUpCe2DeMI"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </section>
    <hr />
    <section id="location">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1657.0273131677727!2d77.25952558461451!3d29.088935848499077!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sin!4v1788605834255!5m2!1sen!2sin"
        width="500"
        height="350"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </section>
    <hr>
    </main>
    <footer>
        © 2026 My Media Gallery 
    </footer>
  </body>
</html>
